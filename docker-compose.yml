services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: solarsurd
      POSTGRES_USER: solarsurd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarsurd"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://solarsurd:${POSTGRES_PASSWORD:-local-development-only}@db:5432/solarsurd
    depends_on:
      db:
        condition: service_healthy

